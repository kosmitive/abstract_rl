[project]
name = "abstract-rl"
version = "0.1.0"
description = "A modular reinforcement learning library (TRPO, MPO) based on MLX."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Markus Semmler" }]
requires-python = ">=3.13,<3.14"
keywords = ["reinforcement learning", "trpo", "mpo", "policy gradient", "gymnasium", "mlx"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "gymnasium[classic-control]>=1.0",
    "hydra-core>=1.3.7",
    "matplotlib>=3.9",
    # Metal on macOS, the CPU backend on Linux
    "mlx>=0.32.4; sys_platform == 'darwin'",
    "mlx[cpu]>=0.32.4; sys_platform == 'linux'",
    "numpy>=2.1",
    "pandas>=2.2",
]

[project.urls]
Homepage = "https://github.com/kosmitive/abstract_rl"
Source = "https://github.com/kosmitive/abstract_rl"
Issues = "https://github.com/kosmitive/abstract_rl/issues"

[project.optional-dependencies]
mujoco = [
    "gymnasium[mujoco]>=1.0",
]
baselines = [
    "sb3-contrib>=2.4",
    "stable-baselines3>=2.4",
    # direct dependency of the extra, so the CPU-only index below applies
    "torch>=2.5",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abstract_rl"]

# CPU-only PyTorch wheels for the optional baselines (much smaller); remove to use the default CUDA builds.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "NPY", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.13"
files = ["src"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false

[[tool.mypy.overrides]]
# optional extra `baselines`, only imported by scripts/run_baselines.py
module = ["stable_baselines3.*", "sb3_contrib.*", "torch", "torch.*"]
ignore_missing_imports = true
