[project]
name = "abstract-rl"
version = "0.1.0"
description = "A modular reinforcement learning library (TRPO, MPO) based on JAX."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Markus Semmler" }]
requires-python = ">=3.12,<3.14"
keywords = ["reinforcement learning", "trpo", "mpo", "policy gradient", "jax", "equinox"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "hydra-core>=1.3.7",
    "matplotlib>=3.9",
    "numpy>=2.1",
    "pandas>=2.2",
    "jax>=0.11,<0.12",
    "equinox>=0.13",
    "optax>=0.2",
    "jaxtyping>=0.3",
    "beartype>=0.19",
    "gymnax>=1.0.1",
    "brax>=0.14.2",
    "mujoco>=3.16",
    "mujoco-mjx>=3.16",
    "playground>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/kosmitive/abstract_rl"
Source = "https://github.com/kosmitive/abstract_rl"
Issues = "https://github.com/kosmitive/abstract_rl/issues"

[project.optional-dependencies]
mps = [
    "jax-mps>=0.11,<0.12; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
baselines = [
    "gymnasium[classic-control,mujoco]>=1.0",
    "sb3-contrib>=2.4",
    "stable-baselines3>=2.4",
]

[dependency-groups]
dev = [
    "gymnasium[classic-control]>=1.0",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abstract_rl"]

# CPU-only PyTorch wheels (much smaller); remove to use the default CUDA builds.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "NPY", "RUF"]
# F722: jaxtyping shape strings are not forward annotations
ignore = ["F722"]

[tool.ruff.lint.isort]
# also for modules that only exist on the torch commit the golden recorder runs on (tests/fixtures)
known-first-party = ["abstract_rl"]

[tool.ruff.lint.per-file-ignores]
# the jaxtyping import hook must precede the imports it instruments
"tests/conftest.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false

[[tool.mypy.overrides]]
# optional extra `baselines` (scripts/run_baselines.py) and the JAX environment backends, which ship no stubs
module = ["stable_baselines3.*", "sb3_contrib.*", "gymnax.*", "brax.*", "mujoco_playground.*", "mujoco.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# optax ships no type information
module = ["optax.*"]
ignore_missing_imports = true
