[project]
name = "abstract-rl"
version = "0.1.0"
description = "A modular reinforcement learning library (TRPO, MPO) based on PyTorch."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Markus Semmler" }]
requires-python = ">=3.13,<3.14"
keywords = ["reinforcement learning", "trpo", "mpo", "policy gradient", "gymnasium", "pytorch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "gymnasium[classic-control]>=1.0",
    "matplotlib>=3.9",
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "torch>=2.5",
]

[project.urls]
Source = "https://github.com/kosmitive/abstract_rl"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=8.3",
    "ruff>=0.7",
    "scipy-stubs>=1.18.1.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abstract_rl"]

# CPU-only PyTorch wheels (much smaller); remove to use the default CUDA builds.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "NPY", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.13"
files = ["src"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false

[[tool.mypy.overrides]]
# Dropped once the Gymnasium port replaces these imports.
module = [
    "gym",
    "gym.*",
    "quanser_robots",
    "quanser_robots.*",
]
ignore_missing_imports = true
