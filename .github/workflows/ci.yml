name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Ruff check
        run: uv run ruff check
      - name: Ruff format
        run: uv run ruff format --check

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Mypy
        run: uv run mypy src

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Pytest
        run: uv run pytest

  wheel:
    name: wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Build
        run: uv build
      - name: Install the wheel into a clean environment and compose a config
        run: |
          wheel="$(ls "$GITHUB_WORKSPACE"/dist/*.whl)"
          cd "$RUNNER_TEMP"
          uv venv --python 3.13 venv
          uv pip install --python venv/bin/python "$wheel"
          venv/bin/python -c "import abstract_rl.scripts.run"
          venv/bin/python -m abstract_rl.scripts.run --cfg job env=halfcheetah alg=trpo alg.trpo_tr_eps=0.03
