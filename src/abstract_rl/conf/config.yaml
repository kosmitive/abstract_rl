# Benchmark run configuration (Hydra). Example:
#   uv run python -m abstract_rl.scripts.run env=mountaincar alg=mpo seed=3 alg.policy_sigma=1.5
# ``alg`` and ``env`` are config groups. ``tune_all`` and ``tune`` are selected by interpolation and merged
# into the algorithm node. Command line overrides of ``alg.*`` are applied by Hydra after that merge.
defaults:
  - alg: trpo
  - env: pendulum
  - optional tune_all: ${env}
  - tune: ${env}_${alg}
  - _self_
  # no run.log in the working directory, results are written to data_root
  - override hydra/job_logging: none

seed: 1
# several seeds trained at once in one vmapped program (null: just `seed`), e.g. seeds=[1,2,3,4]
seeds: null
# JAX backend of a run: cpu (default) or mps (Metal, needs the `mps` extra; MJX environments only run on cpu).
# Humanoid-v5 is a host Gymnasium env: the rollout stays on CPU and the learner follows this platform.
# an already set JAX_PLATFORMS environment variable takes precedence
jax_platform: cpu
data_root: data
# hard env-step budget (null: keep the value from the algorithm node, which is unset unless a tune file sets one)
max_env_steps: null
# Humanoid-v5 is configured (conf/env/humanoid.yaml) but is not part of this JAX benchmark order
env_order:
  - Pendulum-v1
  - MountainCarContinuous-v0
  - InvertedPendulum-v5
  - InvertedDoublePendulum-v5
  - HalfCheetah-v5

hydra:
  run:
    dir: .
  sweep:
    dir: ${data_root}/.multirun
    subdir: ${hydra.job.num}
  output_subdir: null
  job:
    chdir: false
  hydra_logging:
    root:
      level: WARN
