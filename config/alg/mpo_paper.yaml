# Paper MPO (Abdolmaleki et al. 2018, arXiv 1806.06920 and 1812.02256).
# Inherits the MPO defaults, then turns on the three paper options:
#   decoupled mean/covariance KL, a state-dependent Cholesky policy, and an Adam dual for η.
defaults:
  - mpo
  - _self_

name: mpo_paper
alg: mpo
policy_type: full
policy_cov_type: full
mpo_kl_mode: decoupled
mpo_eps_mean: 0.1
mpo_eps_cov: 1.0e-4
eta_solver: sgd
