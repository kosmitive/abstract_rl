# TRPO defaults (tuned on Pendulum-v1)
name: trpo
env_discount: 0.99
env_normalize: true
env_num_threads: 1
env_render: false
policy_structure: [64, 64]
policy_act_fn: [tanh, tanh, none]
policy_layer_norm: false
policy_init: xavier_gaussian
policy_sync_steps: 1
# softplus(bias) = init_std on a state-dependent or Cholesky diagonal, and the std/Cholesky
# final-layer weights are multiplied by 0.01. A state-independent or fixed std uses
# log_sigma = log(init_std). A zero state then starts at init_std + policy_min_std.
policy_init_std: 0.5
# softplus(raw) + policy_min_std on a state-dependent or Cholesky diagonal. A state-independent
# std uses max(exp(log_sigma), policy_min_std), so a configured std above the floor is unchanged.
policy_min_std: 0.0
# Decay policy_min_std linearly to 0 over this many env steps. 0 keeps it constant.
# Refreshed at the start of each epoch from the env-step count.
policy_min_std_anneal_steps: 0
# 0.01 multiplies the final-layer mean weights so initial actions sit near 0. 1.0 would leave
# that head on the default init. Hidden layers stay on the default init. Mean bias stays 0.
policy_mean_init_scale: 0.01
# single: one learned std. fixed: a constant std. state: a state-dependent diagonal.
# full: state-dependent Cholesky. One-dimensional actions use the univariate policy
# unless cov_type is full.
policy_cov_type: single
policy_squash: true
# Running observation normalisation, applied when acting and when training. Off leaves results unchanged.
#   alg.obs_norm=true alg.obs_clip=10
obs_norm: false
obs_clip: 10.0
max_steps: 200
# fully connected neural v function
val_struct: [64, 64]
val_layer_norm: false
val_act_fn: [tanh, tanh, none]
val_init: xavier_gaussian
val_sync_steps: 1
val_l2_reg: 0.001
# Minibatch Adam on the value loss, in the style of a PPO value fit: 10 passes
# over the rollout, minibatches of 64, step size 3e-4.
val_lr: 3.0e-4
val_epochs: 10
val_batch_size: 64
# Global-norm cap on the value-net Adam step. The trust-region policy step is unchanged. 0 disables it.
grad_clip: 40.0
# advantage settings
gae_lambda: 0.95
# Transitions collected each epoch, and the on-policy update batch. The epoch count is
# ceil(env.steps / env_sample).
env_sample: 4000
# trpo
trpo_cg_max_k: 10
trpo_cg_res_tol: 1.0e-10
trpo_dvp_damping: 0.1
trpo_tr_eps: 0.01
