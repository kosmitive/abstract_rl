# MPO defaults (tuned on Pendulum-v1)
name: mpo
env_discount: 0.99
env_normalize: true
env_num_threads: 1
env_render: false
policy_structure: [64, 64]
policy_act_fn: [tanh, tanh, none]
policy_layer_norm: false
policy_init: xavier_gaussian
policy_sync_steps: 1
# softplus(bias) = init_std on a state-dependent or Cholesky diagonal, and the std/Cholesky
# final-layer weights are multiplied by 0.01. A state-independent or fixed std uses
# log_sigma = log(init_std). A zero state then starts at init_std + policy_min_std.
policy_init_std: 0.5
# softplus(raw) + policy_min_std on a state-dependent or Cholesky diagonal. A state-independent
# std uses max(exp(log_sigma), policy_min_std), so a configured std above the floor is unchanged.
policy_min_std: 0.0
# Decay policy_min_std linearly to 0 over this many env steps. 0 keeps it constant.
# Refreshed at the start of each epoch from the env-step count.
policy_min_std_anneal_steps: 0
# 1.0 leaves the mean head on the default init. Any other value multiplies only the final-layer
# mean weights and leaves the mean bias at 0. Hidden layers stay on the default init.
policy_mean_init_scale: 1.0
# full: state-dependent Cholesky. single: one learned std. fixed: a constant std.
# state: a state-dependent diagonal. One-dimensional actions use the univariate policy
# unless cov_type is full.
policy_cov_type: full
policy_squash: true
# Running observation normalisation, applied when acting and when training. Off leaves results unchanged.
#   alg.obs_norm=true alg.obs_clip=10
obs_norm: false
obs_clip: 10.0
max_steps: 200
alg: mpo
env_traj_evaluations: 5
# Transitions collected each epoch. The epoch count is ceil(env.steps / env_sample).
env_sample: 1000
# off policy memory (number of transitions)
tc_size: 50000
mem_bootstrap_steps: 5
# retrace
ret_lambda: 1.0
res_add_acts: 20
# non-parametric e-step. η is an Adam dual on each M-step minibatch.
rnk_eps: 0.1
rnk_lr: 0.0003
rnk_init_eta: 1.0
# fully connected neural q function
val_struct: [256, 256]
val_optimizer: adam
val_lr: 0.001
val_opt_steps: 1000
val_batch_size: 256
val_layer_norm: false
val_act_fn: [elu, elu, none]
val_init: xavier_gaussian
val_sync_steps: 1
val_l2_reg: 0.0
policy_opt_steps: 100
# M-step minibatch. Collection size is env_sample.
policy_batch_size: 256
# m-step. Decoupled mean and covariance KL (Abdolmaleki et al. 2018, arXiv 1806.06920 and
# 1812.02256). Each bound has its own positive multiplier.
mpo_inner_lr: 0.01
mpo_outer_lr: 0.0003
mpo_eps_mean: 0.1
mpo_eps_cov: 1.0e-4
mpo_l2_reg: 0.0
