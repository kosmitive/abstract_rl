# Humanoid-v5 trains on Gymnasium MuJoCo. MJX is not used.
# The observation is 348 and the action is 17 torques in [-0.4, 0.4].
# A fall terminates the episode: torso height outside [1, 2] (terminate_when_unhealthy).
# The time limit is 1000 steps.
# 3000000 env steps is a reduced budget. Published Humanoid runs usually use 5–10 million steps or more.
# Gymnasium registers no reward_threshold. success is 5000 because healthy_reward is 5, so an episode
# that stays upright for all 1000 steps, with no forward reward and negligible costs, scores about 5000.
# Walking adds forward reward on top of that.
id: Humanoid-v5
success: 5000.0
steps: 3000000
overrides:
  all: {max_steps: 1000}
  trpo:
    num_epochs: 200
    policy_batch_size: 15000
    policy_structure: [256, 256]
    val_struct: [256, 256]
  mpo:
    num_epochs: 3000
    policy_structure: [256, 256]
    policy_sigma: 0.5
    mpo_trust_regions: [0.02]
