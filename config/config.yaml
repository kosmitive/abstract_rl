# Benchmark run configuration (Hydra). Example:
#   uv run python -m abstract_rl.scripts.run env=mountaincar alg=mpo seed=3 alg.policy_init_std=1.5
# A run is the base configuration of the algorithm (alg/) with the environment overrides of env/<env>.yaml on top;
# command line overrides of alg.* win over both.
defaults:
  - env: pendulum
  - alg: trpo
  - _self_

seed: 1
data_root: data

hydra:
  run:
    dir: .
  sweep:
    dir: ${data_root}/.multirun
    subdir: ${hydra.job.num}
  output_subdir: null
  job:
    chdir: false
  job_logging:
    root:
      level: WARN
  hydra_logging:
    root:
      level: WARN
